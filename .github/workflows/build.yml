name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - minecraft: "26.2"
            fabric_api: "0.161.0+26.2"
          - minecraft: "26.3"
            fabric_api: "0.162.0+26.3"
    name: build (${{ matrix.minecraft }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }}
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.minecraft }}
          path: build/libs/*.jar
